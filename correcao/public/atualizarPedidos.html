<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar pedidos</title>
</head>
<body>
    <form>
        
    <input type="number" id="id" name="id" placeholder="Digite o id do equipamento" required>
    <br><br>
    <input type="text" id="nome" name="nome" placeholder="Nome do equipamento" required>
    <br><br>

    <input type="number" id="quantidade" name="quantidade" placeholder="Quantidade" required>
    <br><br>

    <input type="text" id="categoria" name="categoria" placeholder="Categoria" required>
    <br><br>

    <button type="submit" onclick="atualizarPedidos()">Atualizar</button>
    </form>
</body>
<script>
    async function atualizarPedidos() {
        const idEquipamentos = document.getElementById("id").value;
        const nome = document.getElementById("nome").value;
        const quantidade = document.getElementById("quantidade").value;
        const categoria = document.getElementById("categoria").value;
        const pedido = {idEquipamentos, nome, quantidade, categoria};
        const resposta = await fetch(`http://localhost:3000/produtos/${idEquipamentos}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(pedido)
        });
        const pedidos = resposta.text();
        console.log(pedidos)
        alert("O pedido foi atualizado")
    }

</script>
</html>
