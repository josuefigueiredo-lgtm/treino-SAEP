<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="number" id="id" name="id" placeholder="Digite o id do equipamento" required>
    
    <button type="submit" onclick="deletarPedidos()">Deletar</button>
</body>

<script>
    async function deletarPedidos() {
        const idEquipamentos = document.getElementById("id").value;
        const pedido = {idEquipamentos}

        const resposta = await fetch(`http://localhost:3000/produtos/${idEquipamentos}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(pedido)
        }) 

        alert("Pedido deletado")
        
    }
</script>
</html>
