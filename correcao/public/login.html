<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="mensagem"></h1>
    <button onclick="sair()">Sair</button>
    <button onclick="verificar()">Verificar Produtos</button>
    <button onclick="cadastrarPedidos()">Cadastrar Produtos</button>


</body>
<script>

    const parametros = new URLSearchParams(window.location.search);

    const nome = parametros.get('nome');

    document.getElementById('mensagem')
        .innerHTML = `Bem-vindo, ${nome}`;

        function sair(){
            window.location.href = 'http://127.0.0.1:5501/public/index.html';
        }

        function verificar(){
             window.location.href = 'http://127.0.0.1:5501/public/verificarPedidos.html';
        }
        function cadastrarPedidos(){
            window.location.href = 'http://127.0.0.1:5501/public/cadastrarPedidos.html';
        }

</script>
</html>
