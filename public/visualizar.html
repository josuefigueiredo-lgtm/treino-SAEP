<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar</title>
</head>
<body>
    <div id="visualizar"></div>
</body>

<script>
    async function visualizar(){
        const equipamentos = await fetch("http://localhost:3000/equipamentos");
        const respostas = await equipamentos.json();
        const visualizarEquipamento = document.getElementById("visualizar")

        respostas.forEach(equipamento => {
            visualizarEquipamento.innerHTML += `Temos ${equipamento.nome} na quantidade ${equipamento.quantidade} da categoria ${equipamento.categoria} <br>`
        });
        
        console.log(respostas)
    }
    visualizar();
</script>
</html>
