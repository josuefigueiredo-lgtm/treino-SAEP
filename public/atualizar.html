<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        id: <input type="number" name= "idEquipamentos"  placeholder="Digite seu id" id="id" required>
        Nome: <input type="text" name= "nome"  placeholder="Nome" id="nome" required>
        Categoria:  <input name= "categoria" type="text" placeholder="Categoria" id="categoria" required>
        Quantidade: <input name="quantidade" type="number" placeholder="Quantidade" id="quantidade" required>
        <button onclick="alterar()">Enviar</button>
   
</body>
<script>
    async function alterar() {
        const idEquipamentos = document.getElementById("id").value;
        const nome = document.getElementById("nome").value;
        const quantidade = document.getElementById("quantidade").value;
        const categoria = document.getElementById("categoria").value;

        const equipamentos = {idEquipamentos,nome, categoria, quantidade};
        const resposta = await fetch (`http://localhost:3000/equipamentos/${idEquipamentos}`, {
            method: "PUT",
            headers:{
                "Content-type":"application/json"
            },
            body: JSON.stringify(equipamentos)
        })
        alert("Equipamento alterado")
    }
</script>
</html>
